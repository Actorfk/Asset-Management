                                                <td>{{ record.target_user || '-' }}</td>
                                                <td>{{ record.target_department || '-' }}</td>
                                                <td>{{ record.target_location || '-' }}</td>
                                                <td>{{ record.remark || '-' }}</td>
                                                <td>{{ formatDate(record.created_at) }}</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                    <div v-if="transferRecords.length === 0" class="empty-state">
                                        <svg viewBox="0 0 24 24" fill="currentColor">
                                            <path d="M19 5v14H5V5h14m0-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-4.86 8.86l-3 3.87L9 13.14 6 17h12l-3.86-5.14z"/>
                                        </svg>
                                        <p>暂无调拨记录</p>
                                    </div>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button class="btn btn-secondary" @click="closeDetailModal">关闭</button>
                            </div>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const devices = ref([]);
                const showModal = ref(false);
                const editingDevice = ref(null);
                const form = ref({
                    asset_no: '',
                    asset_model: '',
                    serial_number: '',
                    user_name: '',
                    department: '',
                    location: '',
                    stock_type: 'in_use',
                    supplier: '',
                    entry_amount: '',
                    entry_date: '',
                    remark: ''
                });

                // 统计数据
                const stats = ref({ total: 0, in_use: 0, stock: 0, fault: 0 });

                // 状态筛选
                const statusFilter = ref('');

                // 资产字段配置
                const assetFieldConfigs = ref([]);

                const loadFieldConfigs = async () => {
                    try {
                        const response = await apiCall('/asset-fields/device');
                        if (response.ok) {
                            assetFieldConfigs.value = await response.json();
                        }
                    } catch (error) {
                        console.error('加载字段配置失败:', error);
                    }
                };

                const isFieldVisible = (assetType, fieldName) => {
                    const config = assetFieldConfigs.value.find(f => f.field_name === fieldName);
                    return config ? config.visible : true;
                };

                const isFieldRequired = (assetType, fieldName) => {
                    const config = assetFieldConfigs.value.find(f => f.field_name === fieldName);
                    return config ? config.required : false;
                };

                const calculateResidualValue = (asset) => {
                    if (!asset || !asset.entry_amount || !asset.entry_date) return '-';
                    const entryDate = new Date(asset.entry_date);
                    const now = new Date();
                    const yearsUsed = (now - entryDate) / (365.25 * 24 * 60 * 60 * 1000);
                    const usefulLife = 5; // 假设使用年限5年
                    const residualRate = 0.05; // 残值率5%
                    const annualDepreciation = asset.entry_amount * (1 - residualRate) / usefulLife;
                    const totalDepreciation = Math.min(annualDepreciation * yearsUsed, asset.entry_amount * (1 - residualRate));
                    const residualValue = Math.max(asset.entry_amount - totalDepreciation, asset.entry_amount * residualRate);
                    return '¥' + residualValue.toFixed(2);
                };

                const toggleStatusFilter = (status) => {
                    statusFilter.value = statusFilter.value === status ? '' : status;
                };

                // 搜索和筛选
                const searchKeyword = ref('');
                const showFilterMenu = ref(false);
                const defaultDeviceColumns = [
                    { key: 'asset_model', label: '资产型号', visible: true },
                    { key: 'serial_number', label: '序列号', visible: true },
                    { key: 'user_name', label: '使用人', visible: true },
                    { key: 'department', label: '使用部门', visible: true },
                    { key: 'location', label: '使用位置', visible: true },
                    { key: 'supplier', label: '供应商', visible: true },
                    { key: 'entry_amount', label: '入账金额', visible: true },
                    { key: 'entry_date', label: '入账日期', visible: true },
                    { key: 'status', label: '状态', visible: true },
                    { key: 'remark', label: '备注', visible: true }
                ];

                const savedDeviceCols = localStorage.getItem('device_columns');
                const columns = ref(savedDeviceCols ? JSON.parse(savedDeviceCols) : defaultDeviceColumns);

                const saveColumns = () => {
                    localStorage.setItem('device_columns', JSON.stringify(columns.value));
                };

                const getColumnVisible = (key) => {
                    const col = columns.value.find(c => c.key === key);
                    return col ? col.visible : true;
                };

                const tableColClass = computed(() => {
                    const count = columns.value.filter(c => c.visible).length + 1;
                    if (count >= 12) return 'col-12';
                    if (count >= 11) return 'col-11';
                    if (count >= 10) return 'col-10';
                    if (count >= 9) return 'col-9';
                    if (count >= 8) return 'col-8';
                    return '';
                });

                const filteredDevices = computed(() => {
                    let result = devices.value;
                    if (statusFilter.value) {
                        result = result.filter(d => d.status === statusFilter.value);
                    }
                    if (searchKeyword.value) {
                        const keyword = searchKeyword.value.toLowerCase();
                        result = result.filter(d => 
                            (d.asset_no && d.asset_no.toLowerCase().includes(keyword)) ||
                            (d.user_name && d.user_name.toLowerCase().includes(keyword))
                        );
                    }
                    return result;
                });

                const updateStats = () => {
                    stats.value = {
                        total: devices.value.length,
                        in_use: devices.value.filter(d => d.status === 'in_use').length,
                        stock: devices.value.filter(d => d.status === 'stock').length,
                        fault: devices.value.filter(d => d.status === 'fault').length
                    };
                };

                const handleSearch = () => {
                    // 搜索是响应式的，不需要额外处理
                };

                const clearSearch = () => {
                    searchKeyword.value = '';
                };

                const loadDevices = async () => {
                    try {
                        const response = await apiCall('/devices');
                        devices.value = await response.json();
                        updateStats();
                    } catch (error) {
                        console.error('加载设备资产失败:', error);
                    }
                };

                const getStatusName = (status) => {
                    const names = {
                        'in_use': '在用',
                        'stock': '库存',
                        'fault': '故障'
                    };
                    return names[status] || status;
                };

                const handleStockTypeChange = () => {
                    if (form.value.stock_type === 'in_use') {
                        form.value.status = 'in_use';
                    } else if (form.value.stock_type === 'stock_normal') {
                        form.value.status = 'stock';
                    } else if (form.value.stock_type === 'stock_fault') {
                        form.value.status = 'fault';
                    }
                };

                const handleDateInput = (event, field) => {
                    let value = event.target.value.replace(/[^\d]/g, '');
                    if (value.length > 8) {
                        value = value.substring(0, 8);
                    }
                    if (value.length >= 5) {
                        value = value.substring(0, 4) + '-' + value.substring(4, 6) + (value.length > 6 ? '-' + value.substring(6) : '');
                    }
                    form.value[field] = value;
                };

                const onDatePicked = (event, field) => {
                    if (event.target.value) {
                        form.value[field] = event.target.value;
                    }
                };

                const openDatePicker = (event) => {
                    const wrapper = event.currentTarget.closest('.date-picker-wrapper');
                    const nativeInput = wrapper.querySelector('input[type="date"]');
                    if (nativeInput) {
                        nativeInput.showPicker && nativeInput.showPicker() || nativeInput.click();
                    }
                };

                const editDevice = (device) => {
                    editingDevice.value = device;
                    form.value = { ...device, stock_type: device.status === 'in_use' ? 'in_use' : (device.status === 'stock' ? 'stock_normal' : 'stock_fault') };
                    showModal.value = true;
                };

                const closeModal = () => {
                    showModal.value = false;
                    editingDevice.value = null;
                    form.value = {
                        asset_no: '',
                        asset_model: '',
                        serial_number: '',
                        user_name: '',
                        department: '',
                        location: '',
                        stock_type: 'in_use',
                        supplier: '',
                        entry_amount: '',
                        entry_date: '',
                        remark: ''
                    };
                };

                const saveDevice = async () => {
                    try {
                        // 验证必填字段
                        for (const field of assetFieldConfigs.value) {
                            if (field.visible && field.required && !form.value[field.field_name]) {
                                alert('请填写' + field.field_label);
                                return;
                            }
                        }
                        
                        // 根据stock_type设置status
                        handleStockTypeChange();
                        
                        const url = editingDevice.value 
                            ? `/devices/${editingDevice.value.id}`
                            : '/devices';
                        
                        const method = editingDevice.value ? 'PUT' : 'POST';
                        
                        const response = await apiCall(url, {
                            method,
                            body: JSON.stringify(form.value)
                        });

                        if (response.ok) {
                            closeModal();
                            loadDevices();
                        }
                    } catch (error) {
                        console.error('保存设备资产失败:', error);
                    }
                };

                const deleteDevice = async (id) => {
                    if (confirm('确定要删除这个设备吗？')) {
                        try {
                            const response = await apiCall(`/devices/${id}`, {
                                method: 'DELETE'
                            });

                            if (response.ok) {
                                loadDevices();
                            }
                        } catch (error) {
                            console.error('删除设备资产失败:', error);
                        }
                    }
                };

                // 调拨相关
                const showTransferModal = ref(false);
                const transferAsset = ref(null);
                const transferForm = ref({
                    asset_type: 'device',
                    asset_id: null,
                    transfer_type: 'to_stock',
                    status: 'normal',
                    target_user: '',
                    target_department: '',
                    target_location: '',
                    remark: ''
                });

                const openTransferModal = (asset, type) => {
                    transferAsset.value = asset;
                    transferForm.value = {
                        asset_type: type,
                        asset_id: asset.id,
                        transfer_type: 'to_stock',
                        status: 'normal',
                        target_user: '',
                        target_department: '',
                        target_location: '',
                        remark: ''
                    };
                    showTransferModal.value = true;
                };

                const closeTransferModal = () => {
                    showTransferModal.value = false;
                    transferAsset.value = null;
                };

                const submitTransfer = async () => {
                    try {
                        const response = await apiCall('/transfer', {
                            method: 'POST',
                            body: JSON.stringify(transferForm.value)
                        });
                        if (response.ok) {
                            closeTransferModal();
                            loadDevices();
                            alert('调拨成功');
                        } else {
                            const data = await response.json();
                            alert(data.error || '调拨失败');
                        }
                    } catch (error) {
                        console.error('调拨失败:', error);
                        alert('调拨失败');
                    }
                };

                // 详情相关
                const showDetailModal = ref(false);
                const detailAsset = ref(null);
                const transferRecords = ref([]);

                const openDetailModal = async (asset) => {
                    detailAsset.value = asset;
                    showDetailModal.value = true;
                    await loadTransferRecords(asset.asset_no);
                };

                const closeDetailModal = () => {
                    showDetailModal.value = false;
                    detailAsset.value = null;
                    transferRecords.value = [];
                };

                const loadTransferRecords = async (assetNo) => {
                    try {
                        const response = await apiCall(`/transfer/records/${assetNo}`);
                        transferRecords.value = await response.json();
                    } catch (error) {
                        console.error('加载调拨记录失败:', error);
                    }
                };

                const formatDate = (dateStr) => {
                    if (!dateStr) return '-';
                    const date = new Date(dateStr);
                    return date.toLocaleString('zh-CN');
                };

                // 导出设备资产
                const exportDevices = async () => {
                    try {
                        const response = await fetch(`${API_BASE}/devices/export`, {
                            credentials: 'same-origin'
                        });

                        if (response.ok) {
                            const blob = await response.blob();
                            const url = window.URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = `设备资产台账_${new Date().toISOString().slice(0, 10)}.xlsx`;
                            document.body.appendChild(a);
                            a.click();
                            document.body.removeChild(a);
                            window.URL.revokeObjectURL(url);
                        } else {
                            const data = await response.json();
                            alert(data.error || '导出失败');
                        }
                    } catch (error) {
                        console.error('导出失败:', error);
                        alert('导出失败：' + error.message);
                    }
                };

                // 下载导入模板
                const importFileInput = ref(null);

                const downloadTemplate = async () => {
                    try {
                        const response = await fetch(`${API_BASE}/devices/template`, {
                            credentials: 'same-origin'
                        });

                        if (response.ok) {
                            const blob = await response.blob();
                            const url = window.URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = '设备资产导入模板.xlsx';
                            document.body.appendChild(a);
                            a.click();
                            document.body.removeChild(a);
                            window.URL.revokeObjectURL(url);
                        } else {
                            const data = await response.json();
                            alert(data.error || '下载模板失败');
                        }
                    } catch (error) {
                        console.error('下载模板失败:', error);
                        alert('下载模板失败：' + error.message);
                    }
                };

                // 触发导入文件选择
                const triggerImport = () => {
                    importFileInput.value.click();
                };

                // 处理导入
                const handleImport = async (event) => {
                    const file = event.target.files[0];
                    if (!file) return;

                    if (!file.name.endsWith('.xlsx')) {
                        alert('请选择xlsx格式的文件');
                        return;
                    }

                    const formData = new FormData();
                    formData.append('file', file);

                    try {
                        const response = await fetch(`${API_BASE}/devices/import`, {
                            method: 'POST',
                            credentials: 'same-origin',
                            body: formData
                        });

                        const data = await response.json();

                        if (response.ok) {
                            let message = data.message;
                            if (data.duplicates && data.duplicates.length > 0) {
                                message += '\n\n重复记录：\n' + data.duplicates.join('\n');
                            }
                            if (data.errors && data.errors.length > 0) {
                                message += '\n\n错误记录：\n' + data.errors.join('\n');
                            }
                            alert(message);
                            loadDevices();
                            loadStats();
                        } else {
                            alert(data.error || '导入失败');
                        }
                    } catch (error) {
                        console.error('导入失败:', error);
                        alert('导入失败：' + error.message);
                    }

                    // 清空文件输入
                    event.target.value = '';
                };

                // 权限检查
                const canEdit = computed(() => hasEditPermission('device'));

                onMounted(() => {
                    loadDevices();
                    loadFieldConfigs();
                });

                return {
                    devices,
                    showModal,
                    editingDevice,
                    form,
                    getStatusName,
                    handleStockTypeChange,
                    handleDateInput,
                    onDatePicked,
                    openDatePicker,
                    isFieldVisible,
                    isFieldRequired,
                    calculateResidualValue,
                    editDevice,
                    closeModal,
                    saveDevice,
                    deleteDevice,
                    showTransferModal,
                    transferAsset,
                    transferForm,
                    canEdit,
                    openTransferModal,
                    closeTransferModal,
                    submitTransfer,
                    showDetailModal,
                    detailAsset,
                    transferRecords,
                    openDetailModal,
                    closeDetailModal,
                    formatDate,
                    stats,
                    statusFilter,
                    toggleStatusFilter,
                    searchKeyword,
                    showFilterMenu,
                    columns,
                    getColumnVisible,
                    saveColumns,
                    tableColClass,
                    filteredDevices,
                    handleSearch,
                    clearSearch,
                    exportDevices,
                    importFileInput,
                    downloadTemplate,
                    triggerImport,
                    handleImport
                };
            },
            created() {
                this.$emit('update-title', '设备资产');
            }
        };

        // 用户管理组件
        const UsersPage = {
            template: `
                <div>
                    <div class="card">
                        <div class="card-header">
                            <div class="card-title">用户管理</div>
                            <button class="btn btn-primary" @click="showModal = true">
                                添加用户
                            </button>
                        </div>
                        
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>用户名</th>
                                    <th>邮箱</th>
                                    <th>部门</th>
                                    <th>职位</th>
                                    <th>电脑资产</th>
                                    <th>设备资产</th>
                                    <th>管理员</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr v-for="user in users" :key="user.id">
                                    <td>{{ user.username }}</td>
                                    <td>{{ user.email }}</td>
                                    <td>{{ user.department || '-' }}</td>
                                    <td>{{ user.position || '-' }}</td>
                                    <td>
                                        <span class="permission-tag" :class="'permission-' + (user.is_admin ? 'edit' : (user.permissions?.computer || 'none'))">
                                            {{ user.is_admin ? '编辑' : getPermissionName(user.permissions?.computer) }}
                                        </span>
                                    </td>
                                    <td>
                                        <span class="permission-tag" :class="'permission-' + (user.is_admin ? 'edit' : (user.permissions?.device || 'none'))">
                                            {{ user.is_admin ? '编辑' : getPermissionName(user.permissions?.device) }}
                                        </span>
                                    </td>
                                    <td>{{ user.is_admin ? '是' : '否' }}</td>
                                    <td>
                                        <button class="btn btn-secondary" @click="editUser(user)">编辑</button>
                                        <button class="btn btn-danger" @click="deleteUser(user.id)" 
                                                :disabled="user.username === 'admin'">删除</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- 添加/编辑模态框 -->
                    <div class="modal" v-if="showModal">
                        <div class="modal-content">
                            <div class="modal-header">
                                <div class="modal-title">{{ editingUser ? '编辑用户' : '添加用户' }}</div>
                                <button class="modal-close" @click="closeModal">&times;</button>
                            </div>
                            <div class="modal-body">
                                <div class="form-group">
                                    <label class="form-label">用户名 *</label>
                                    <input class="form-input-modal" v-model="form.username" placeholder="请输入用户名">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">邮箱 *</label>
                                    <input class="form-input-modal" type="email" v-model="form.email" placeholder="请输入邮箱">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">密码 {{ editingUser ? '(留空则不修改)' : '*' }}</label>
                                    <input class="form-input-modal" type="password" v-model="form.password" placeholder="请输入密码">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">部门</label>
                                    <input class="form-input-modal" v-model="form.department" placeholder="请输入部门">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">职位</label>
                                    <input class="form-input-modal" v-model="form.position" placeholder="请输入职位">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">
                                        <input type="checkbox" v-model="form.is_admin"> 管理员用户
                                    </label>
                                    <div style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">
                                        管理员拥有所有权限
                                    </div>
                                </div>
                                
                                <div v-if="!form.is_admin" style="margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border-color);">
                                    <div style="font-weight: 500; margin-bottom: 15px; color: var(--text-primary);">资产权限设置</div>
                                    
                                    <div class="form-group">
                                        <label class="form-label">电脑资产权限</label>
                                        <select class="form-input-modal" v-model="form.permissions.computer">
                                            <option value="none">无权限</option>
                                            <option value="readonly">只读</option>
                                            <option value="edit">编辑</option>
                                        </select>
                                        <div style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">
                                            {{ getPermissionDesc(form.permissions.computer) }}
                                        </div>
                                    </div>
                                    
                                    <div class="form-group">
                                        <label class="form-label">设备资产权限</label>
                                        <select class="form-input-modal" v-model="form.permissions.device">
                                            <option value="none">无权限</option>
                                            <option value="readonly">只读</option>
                                            <option value="edit">编辑</option>
                                        </select>
                                        <div style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">
                                            {{ getPermissionDesc(form.permissions.device) }}
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button class="btn btn-secondary" @click="closeModal">取消</button>
                                <button class="btn btn-primary" @click="saveUser">保存</button>
                            </div>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const users = ref([]);
                const showModal = ref(false);
                const editingUser = ref(null);
                const form = ref({
                    username: '',
                    email: '',
                    password: '',
                    department: '',
                    position: '',
                    is_admin: false,
                    permissions: {
                        computer: 'readonly',
                        device: 'readonly'
                    }
                });

                const getPermissionName = (permission) => {
                    const names = {
                        'none': '无权限',
                        'readonly': '只读',
                        'edit': '编辑'
                    };
                    return names[permission] || '无权限';
                };

                const getPermissionDesc = (permission) => {
                    const descs = {
                        'none': '无法查看和操作资产',
                        'readonly': '可以查看资产列表和详情',
                        'edit': '可以查看、添加、编辑和删除资产'
                    };
                    return descs[permission] || '';
                };

                const loadUsers = async () => {
                    try {
                        const response = await apiCall('/users');
                        users.value = await response.json();
                    } catch (error) {
                        console.error('加载用户失败:', error);
                    }
                };

                const editUser = (user) => {
                    editingUser.value = user;
                    form.value = { 
                        username: user.username,
                        email: user.email,
                        password: '',
                        department: user.department,
                        position: user.position,
                        is_admin: user.is_admin,
                        permissions: {
                            computer: user.permissions?.computer || 'readonly',
                            device: user.permissions?.device || 'readonly'
                        }
                    };
                    showModal.value = true;
                };

                const closeModal = () => {
                    showModal.value = false;
                    editingUser.value = null;
                    form.value = {
                        username: '',
                        email: '',
                        password: '',
                        department: '',
                        position: '',
                        is_admin: false,
                        permissions: {
                            computer: 'readonly',
                            device: 'readonly'
                        }
                    };
                };

                const saveUser = async () => {
                    try {
                        const url = editingUser.value 
                            ? `/users/${editingUser.value.id}`
                            : '/users';
                        
                        const method = editingUser.value ? 'PUT' : 'POST';
                        
                        const response = await apiCall(url, {
                            method,
                            body: JSON.stringify(form.value)
                        });

                        if (response.ok) {
                            closeModal();
                            loadUsers();
                        } else {
                            const data = await response.json();
                            alert(data.error || '保存用户失败');
                        }
                    } catch (error) {
                        console.error('保存用户失败:', error);
                    }
                };

                const deleteUser = async (id) => {
                    if (confirm('确定要删除这个用户吗？')) {
                        try {
                            const response = await apiCall(`/users/${id}`, {
                                method: 'DELETE'
                            });

                            if (response.ok) {
                                loadUsers();
                            } else {
                                const data = await response.json();
                                alert(data.error || '删除用户失败');
                            }
                        } catch (error) {
                            console.error('删除用户失败:', error);
                        }
                    }
                };

                onMounted(() => {
                    loadUsers();
                });

                return {
                    users,
                    showModal,
                    editingUser,
                    form,
                    editUser,
                    closeModal,
                    saveUser,
                    deleteUser,
                    getPermissionName,
                    getPermissionDesc
                };
            },
            created() {
                this.$emit('update-title', '用户管理');
            }
        };

        // 设置组件
        const BackupPage = {
            template: `
                <div>
                    <div class="card">
                        <div class="card-header">
                            <div class="card-title">数据备份</div>
                        </div>
                        
                        <div style="max-width: 800px;">
                            <div class="form-group">
                                <label class="form-label">备份数据库</label>
                                <p style="color: var(--text-secondary); margin-bottom: 15px; font-size: 14px;">
                                    备份功能将复制当前数据库文件到backup文件夹，系统自动保留最近5份备份。
                                </p>
                                <button class="btn btn-primary" @click="backupData" :disabled="backupLoading">
                                    <span v-if="backupLoading">备份中...</span>
                                    <span v-else>立即备份</span>
                                </button>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">备份记录（最近5份）</label>
                                <div v-if="backups.length === 0" style="color: var(--text-secondary); padding: 20px; text-align: center; background: var(--bg-color); border-radius: 8px;">
                                    暂无备份记录
                                </div>
                                <div v-else style="border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden;">
                                    <table style="width: 100%; border-collapse: collapse;">
                                        <thead>
                                            <tr style="background: var(--table-header-bg);">
                                                <th style="padding: 12px 15px; text-align: left; font-weight: 500;">备份时间</th>
                                                <th style="padding: 12px 15px; text-align: left; font-weight: 500;">文件名</th>
                                                <th style="padding: 12px 15px; text-align: left; font-weight: 500;">文件大小</th>
                                                <th style="padding: 12px 15px; text-align: center; font-weight: 500;">操作</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr v-for="(backup, index) in backups" :key="backup.filename" 
                                                :style="{ borderTop: index > 0 ? '1px solid var(--border-color)' : 'none' }">
                                                <td style="padding: 12px 15px;">{{ backup.created_at_display }}</td>
                                                <td style="padding: 12px 15px; font-family: monospace; font-size: 13px;">{{ backup.filename }}</td>
                                                <td style="padding: 12px 15px;">{{ formatSize(backup.size) }}</td>
                                                <td style="padding: 12px 15px; text-align: center;">
                                                    <button class="btn btn-secondary" style="padding: 6px 16px; font-size: 13px;" 
                                                            @click="restoreData(backup.filename)">
                                                        恢复此备份
                                                    </button>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const backupLoading = ref(false);
                const backups = ref([]);

                const loadBackups = async () => {
                    try {
                        const response = await apiCall('/backups');
                        if (response.ok) {
                            const data = await response.json();
                            backups.value = data.backups || [];
                        }
                    } catch (error) {
                        console.error('加载备份列表失败:', error);
                    }
                };

                const backupData = async () => {
                    backupLoading.value = true;
                    try {
                        const response = await apiCall('/backup', {
                            method: 'POST'
                        });
                        if (response.ok) {
                            const data = await response.json();
                            alert(`备份成功！\n\n备份内容：\n- 电脑资产：${data.computer_count} 条\n- 设备资产：${data.device_count} 条`);
                            await loadBackups();
                        } else {
                            const error = await response.json();
                            alert('备份失败：' + (error.error || '未知错误'));
                        }
                    } catch (error) {
                        console.error('备份失败:', error);
                        alert('备份失败：' + error.message);
                    } finally {
                        backupLoading.value = false;
                    }
                };

                const restoreData = async (filename) => {
                    if (!confirm('恢复数据将覆盖当前数据库，系统将自动刷新。确定继续吗？')) {
                        return;
                    }
                    
                    try {
                        const response = await apiCall('/restore', {
                            method: 'POST',
                            body: JSON.stringify({ filename })
                        });
                        
                        if (response.ok) {
                            const result = await response.json();
                            alert(result.message);
                            window.location.reload();
                        } else {
                            const error = await response.json();
                            alert('恢复失败：' + (error.error || '未知错误'));
                        }
                    } catch (error) {
                        console.error('恢复失败:', error);
                        alert('恢复失败：' + error.message);
                    }
                };

                const formatSize = (bytes) => {
                    if (bytes < 1024) return bytes + ' B';
                    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
                    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
                };

                onMounted(() => {
                    loadBackups();
                });

                return {
                    backupLoading,
                    backups,
                    backupData,
                    restoreData,
                    formatSize
                };
            },
            created() {
                this.$emit('update-title', '数据备份');
            }
        };

        // 设置页面组件
        const SettingsPage = {
            template: `
                <div>
                    <div class="card">
                        <div class="card-header">
                            <div class="card-title">系统设置</div>
                        </div>
                        
                        <div style="max-width: 800px;">
                            <div class="form-group">
                                <label class="form-label">外观设置</label>
                                <div style="display: flex; align-items: center; justify-content: space-between; padding: 15px; background: var(--bg-color); border-radius: 8px; margin-top: 10px;">
                                    <div>
                                        <div style="font-weight: 500; margin-bottom: 4px;">夜间模式</div>
                                        <div style="font-size: 13px; color: var(--text-secondary);">切换深色主题，保护眼睛</div>
                                    </div>
                                    <label class="dark-mode-switch">
                                        <input type="checkbox" v-model="isDarkMode" @change="toggleDarkMode">
                                        <span class="slider"></span>
                                    </label>
                                </div>
                            </div>
                            
                            <div class="form-group" style="margin-top: 30px;">
                                <div @click="assetSettingsExpanded = !assetSettingsExpanded" style="display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none;">
                                    <label class="form-label" style="margin-bottom: 0; cursor: pointer;">资产入账设置</label>
                                    <span style="font-size: 12px; color: var(--text-secondary); transition: transform 0.3s;" :style="{ transform: assetSettingsExpanded ? 'rotate(180deg)' : 'rotate(0deg)' }">▼</span>
                                </div>
                                <p style="color: var(--text-secondary); margin-top: 8px; font-size: 13px;">
                                    配置添加资产时需要填写的字段，可设置字段是否显示和是否必填。
                                </p>
                                
                                <div v-show="assetSettingsExpanded" style="margin-top: 15px;">
                                    <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                                        <button class="btn" :class="activeTab === 'computer' ? 'btn-primary' : 'btn-secondary'" @click="activeTab = 'computer'; loadFieldConfigs()">电脑资产</button>
                                        <button class="btn" :class="activeTab === 'device' ? 'btn-primary' : 'btn-secondary'" @click="activeTab = 'device'; loadFieldConfigs()">设备资产</button>
                                    </div>
                                    
                                    <div style="border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden;">
                                        <table style="width: 100%; border-collapse: collapse;">
                                            <thead>
                                                <tr style="background: var(--table-header-bg);">
                                                    <th style="padding: 12px 15px; text-align: left; font-weight: 500;">字段名称</th>
                                                    <th style="padding: 12px 15px; text-align: center; font-weight: 500; width: 100px;">显示</th>
                                                    <th style="padding: 12px 15px; text-align: center; font-weight: 500; width: 100px;">必填</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <tr v-for="field in fieldConfigs" :key="field.id" style="border-top: 1px solid var(--border-color);">
                                                    <td style="padding: 12px 15px;">{{ field.field_label }}</td>
                                                    <td style="padding: 12px 15px; text-align: center;">
                                                        <input type="checkbox" v-model="field.visible" @change="saveFieldConfigs">
                                                    </td>
                                                    <td style="padding: 12px 15px; text-align: center;">
                                                        <input type="checkbox" v-model="field.required" @change="saveFieldConfigs">
                                                    </td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const isDarkMode = ref(false);
                const activeTab = ref('computer');
                const fieldConfigs = ref([]);
                const assetSettingsExpanded = ref(false);

                const toggleDarkMode = () => {
                    if (isDarkMode.value) {
                        document.body.classList.add('dark-mode');
                        localStorage.setItem('darkMode', 'true');
                    } else {
                        document.body.classList.remove('dark-mode');
                        localStorage.setItem('darkMode', 'false');
                    }
                };

                const loadFieldConfigs = async () => {
                    try {
                        const response = await apiCall('/asset-fields/' + activeTab.value);
                        if (response.ok) {
                            fieldConfigs.value = await response.json();
                        }
                    } catch (error) {
                        console.error('加载字段配置失败:', error);
                    }
                };

                const saveFieldConfigs = async () => {
                    try {
                        const response = await apiCall('/asset-fields/' + activeTab.value, {
                            method: 'PUT',
                            body: JSON.stringify({ fields: fieldConfigs.value })
                        });
                        if (response.ok) {
                            // 配置已保存
                        }
                    } catch (error) {
                        console.error('保存字段配置失败:', error);
                    }
                };

                onMounted(() => {
                    const savedDarkMode = localStorage.getItem('darkMode');
                    if (savedDarkMode === 'true') {
                        isDarkMode.value = true;
                        document.body.classList.add('dark-mode');
                    }
                    loadFieldConfigs();
                });

                return {
                    isDarkMode,
                    toggleDarkMode,
                    activeTab,
                    fieldConfigs,
                    assetSettingsExpanded,
                    loadFieldConfigs,
                    saveFieldConfigs
                };
            },
            created() {
                this.$emit('update-title', '设置');
            }
        };

        // 综合搜索组件
        const SearchPage = {
            template: `
                <div>
                    <div class="card">
                        <div class="card-header">
                            <div class="card-title">综合搜索</div>
                        </div>
                        <p style="color: var(--text-secondary); margin-bottom: 15px; font-size: 14px;">
                            输入使用人姓名，搜索该人员名下的所有电脑和设备资产。
                        </p>
                        <div style="display: flex; gap: 10px; max-width: 500px; align-items: center;">
                            <input class="form-input-modal" v-model="keyword" placeholder="请输入使用人姓名" @keyup.enter="doSearch" style="flex: 1;">
                            <button class="btn btn-primary" @click="doSearch" style="white-space: nowrap; height: 38px;">搜 索</button>
                        </div>
                    </div>

                    <div v-if="searched">
                        <div class="card" v-if="results.computers.length">
                            <div class="card-header">
                                <div class="card-title">电脑资产 ({{ results.computers.length }})</div>
                            </div>
                            <div class="table-wrapper">
                                <table class="data-table">
                                    <thead>
                                        <tr>
                                            <th>资产编号</th>
                                            <th>资产型号</th>
                                            <th>序列号</th>
                                            <th>使用人</th>
                                            <th>使用部门</th>
                                            <th>状态</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr v-for="c in results.computers" :key="c.id">
                                            <td>{{ c.asset_no }}</td>
                                            <td>{{ c.asset_model || '-' }}</td>
                                            <td>{{ c.serial_number || '-' }}</td>
                                            <td>{{ c.user_name || '-' }}</td>
                                            <td>{{ c.department || '-' }}</td>
                                            <td>
                                                <span class="status-tag" :class="'status-' + c.status">
                                                    {{ getStatusName(c.status) }}
                                                </span>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div class="card" v-if="results.devices.length">
                            <div class="card-header">
                                <div class="card-title">设备资产 ({{ results.devices.length }})</div>
                            </div>
                            <div class="table-wrapper">
                                <table class="data-table">
                                    <thead>
                                        <tr>
                                            <th>资产编号</th>
                                            <th>资产型号</th>
                                            <th>序列号</th>
                                            <th>使用人</th>
                                            <th>使用部门</th>
                                            <th>使用位置</th>
                                            <th>状态</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr v-for="d in results.devices" :key="d.id">
                                            <td>{{ d.asset_no }}</td>
                                            <td>{{ d.asset_model || '-' }}</td>
                                            <td>{{ d.serial_number || '-' }}</td>
                                            <td>{{ d.user_name || '-' }}</td>
                                            <td>{{ d.department || '-' }}</td>
                                            <td>{{ d.location || '-' }}</td>
                                            <td>
                                                <span class="status-tag" :class="'status-' + d.status">
                                                    {{ getStatusName(d.status) }}
                                                </span>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div class="card" v-if="!results.computers.length && !results.devices.length">
                            <div style="text-align: center; padding: 40px; color: var(--text-secondary);">
                                未找到与 "{{ keyword }}" 相关的资产
                            </div>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const keyword = ref('');
                const searched = ref(false);
                const results = ref({ computers: [], devices: [] });

                const getStatusName = (status) => {
                    const names = { 'in_use': '在用', 'stock': '库存', 'fault': '故障' };
                    return names[status] || status;
                };

                const doSearch = async () => {
                    if (!keyword.value.trim()) return;
                    try {
                        const response = await apiCall('/search?keyword=' + encodeURIComponent(keyword.value.trim()));
                        if (response.ok) {
                            results.value = await response.json();
                            searched.value = true;
                        }
                    } catch (error) {
                        console.error('搜索失败:', error);
                    }
                };

                return { keyword, searched, results, getStatusName, doSearch };
            },
            created() {
                this.$emit('update-title', '综合搜索');
            }
        };

        // 调拨记录组件
        const TransferPage = {
            template: `
                <div>
                    <div class="card">
                        <div class="card-header">
                            <div class="card-title">调拨记录</div>
                        </div>
                        
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>资产类型</th>
                                    <th>资产编号</th>
                                    <th>调拨类型</th>
                                    <th>目标用户</th>
                                    <th>目标部门</th>
                                    <th>目标位置</th>
                                    <th>备注</th>
                                    <th>调拨时间</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr v-for="record in records" :key="record.id">
                                    <td>{{ record.asset_type_name }}</td>
                                    <td>{{ record.asset_no }}</td>
                                    <td>
                                        <span class="status-tag" :class="record.transfer_type === 'to_stock' ? 'status-stock' : 'status-in_use'">
                                            {{ record.transfer_type_name }}
                                        </span>
                                    </td>
                                    <td>{{ record.target_user || '-' }}</td>
                                    <td>{{ record.target_department || '-' }}</td>
                                    <td>{{ record.target_location || '-' }}</td>
                                    <td>{{ record.remark || '-' }}</td>
                                    <td>{{ formatDate(record.created_at) }}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            `,
            setup() {
                const records = ref([]);

                const loadRecords = async () => {
                    try {
                        const response = await apiCall('/transfer/records');
                        records.value = await response.json();
                    } catch (error) {
                        console.error('加载调拨记录失败:', error);
                    }
                };

                const formatDate = (dateStr) => {
                    if (!dateStr) return '-';
                    const date = new Date(dateStr);
                    return date.toLocaleString('zh-CN');
                };

                onMounted(() => {
                    loadRecords();
                });

                return {
                    records,
                    formatDate
                };
            },
            created() {
                this.$emit('update-title', '调拨记录');
            }
        };

        // 创建路由
        const routes = [
            { path: '/', component: HomePage },
            { path: '/search', component: SearchPage },
            { path: '/computers', component: ComputersPage },
            { path: '/devices', component: DevicesPage },
            { path: '/transfer', component: TransferPage },
            { path: '/users', component: UsersPage },
            { path: '/backup', component: BackupPage },
            { path: '/settings', component: SettingsPage }
        ];

        const router = VueRouter.createRouter({
            history: VueRouter.createWebHashHistory(),
            routes
        });

        // 创建Vue应用
        const app = Vue.createApp({
            data() {
                return {
                    isAuthenticated: false,
                    currentUser: null,
                    pageTitle: '首页',
                    loginForm: {
                        username: '',
                        password: ''
                    },
                    loginError: '',
                    isLoading: false,
                    rememberMe: false
                };
            },
            methods: {
                updatePageTitle(title) {
                    this.pageTitle = title;
                },
                async checkAuth() {
                    try {
                        const response = await fetch(`${API_BASE}/auth/status`, {
                            credentials: 'same-origin'
                        });
                        if (response.ok) {
                            const data = await response.json();
                            if (data.authenticated) {
                                this.isAuthenticated = true;
                                this.currentUser = data.user;
                                // 加载用户权限
                                await loadUserPermissions();
                            }
                        }
                    } catch (error) {
                        console.error('认证检查失败:', error);
                    }
                },
                async handleLogin() {
                    this.loginError = '';
                    this.isLoading = true;

                    try {
                        const response = await fetch(`${API_BASE}/auth/login`, {
                            method: 'POST',
                            credentials: 'same-origin',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(this.loginForm)
                        });

                        const data = await response.json();

                        if (response.ok) {
                            this.isAuthenticated = true;
                            this.currentUser = data.user;
                            if (this.rememberMe) {
                                localStorage.setItem('rememberedUser', this.loginForm.username);
                            } else {
                                localStorage.removeItem('rememberedUser');
                            }
                            // 加载用户权限
                            await loadUserPermissions();
                        } else {
                            this.loginError = data.error || '登录失败';
                        }
                    } catch (error) {
                        this.loginError = '网络错误，请重试';
                        console.error('登录错误:', error);
                    } finally {
                        this.isLoading = false;
                    }
                },
                async handleLogout() {
                    try {
                        await fetch(`${API_BASE}/auth/logout`, {
                            method: 'POST',
                            credentials: 'same-origin'
                        });
                    } catch (error) {
                        console.error('退出登录错误:', error);
                    }
                    
                    this.isAuthenticated = false;
                    this.currentUser = null;
                    this.loginForm = { username: '', password: '' };
                }
            },
            mounted() {
                this.checkAuth();
                
                // 检查记住的用户
                const rememberedUser = localStorage.getItem('rememberedUser');
                if (rememberedUser) {
                    this.loginForm.username = rememberedUser;
                    this.rememberMe = true;
                }
                
                // 加载夜间模式设置
                const savedDarkMode = localStorage.getItem('darkMode');
                if (savedDarkMode === 'true') {
                    document.body.classList.add('dark-mode');
                }
            }
        });

        // 使用路由
        app.use(router);

        // 挂载应用
        app.mount('#app');
    </script>
</body>
</html>
